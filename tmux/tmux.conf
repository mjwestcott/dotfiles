# ---- General ----------------------------------------------------------------

# Change prefix to C-a.
set-option -g prefix C-a
bind C-a last-window

# Allows us to use C-a a <command> to send commands to a
# TMUX session inside another TMUX session.
bind a send-prefix

# Start numbering at 1, and close the gaps that leaves when a window is killed.
set-option -g base-index 1
set-option -g pane-base-index 1
set-option -g renumber-windows on

# Colour. terminal-features is the modern spelling of Tc, and adds underline
# styles. The sitm override stays because it is cheap insurance: it only matters
# if the outer terminfo entry omits italics, which is exactly the case that is
# awkward to notice.
set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm*:RGB:usstyle'
set -as terminal-overrides ',xterm*:sitm=\E[3m'

# Let nvim see FocusGained/FocusLost, so autoread and gitsigns refresh on switch.
set-option -g focus-events on

# Let unrecognised escape sequences through to Ghostty, for image protocols and
# anything else that talks to the terminal directly.
set-option -g allow-passthrough on

# Set the system clipboard via OSC 52. Unlike tmux-yank's pbcopy this also works
# when the tmux server is on the far end of an ssh connection.
set-option -g set-clipboard on

# Support using the mouse.
set -g mouse on

# Allows for faster key repetition.
set-option -s escape-time 0

# Vi copypaste mode.
set-window-option -g mode-keys vi
bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'y' send -X copy-selection

# hjkl pane traversal.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Use ALT to switch windows.
bind -n M-Left  previous-window
bind -n M-Right next-window
bind -n M-a     last-window

# Use ALT to switch sessions.
bind -n M-Up   switch-client -p
bind -n M-Down switch-client -n

# Create a new session.
bind S command-prompt -p "New session:" "new-session -s '%%'"
bind N new-session

# Reload config.
bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."

# Auto window rename.
set-window-option -g automatic-rename on

# Split panes.
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

# Move windows.
bind -r > swap-window -t :+
bind -r < swap-window -t :-

# Update the status bar every n seconds. The clock only shows HH:MM, so once a
# second was 60x more redraws than the content can change.
set-option -g status-interval 5

# Toggle status bar.
bind 'b' set-option status

# Use key map for the status bar.
set-option -g status-keys vi

# Set larger history buffer. Agent sessions produce a lot of scrollback.
set-option -g history-limit 50000

# ---- Presentation -----------------------------------------------------------

# Pane borders colors.
set-option -g pane-border-style fg="#7f9f7f"
set-option -g pane-active-border-style fg="#7f9f7f"

# Default status bar contents.
set-option -g status-justify centre
set-option -g status-left '#[fg=#7f9f7f][#S] '
set-option -g status-right '%H:%M'

# Default status bar colours.
set-option -g status-style fg="#7f9f7f",bg="#353535"

# Window status markers.
set-window-option -g window-status-format ' #I:#W '
set-window-option -g window-status-current-format '#[fg=#353535,bg=#7f9f7f] #I:#W '

# ---- Plugins ----------------------------------------------------------------

set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
